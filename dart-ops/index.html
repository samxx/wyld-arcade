<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oliver's Dart Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: a foam-arena floor plan on the left, a mission control panel on the right; stacks to one column under 900px */
  color-scheme: light;
  --page:#FFF4DE;
  --panel:#FFFFFF;
  --ink:#1C2430;
  --ink-soft:#5A6475;
  --floor:#33465C;
  --orange:#FF6A13;
  --blue:#1C78D4;
  --yellow:#FFD23F;
  --purple:#7A3EE0;
  --teal:#0E9F8E;
  --lava:#E5452B;
  --good:#2E9E4F;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Lexend','Trebuchet MS',Verdana,sans-serif;
  --step:480ms;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.bar{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:3px solid var(--ink);background:var(--panel)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,2.4vw,28px);margin:0;white-space:nowrap;color:var(--ink)}
h1 span{color:var(--orange)}
.missions{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding:4px 2px}
.wp{flex:none;min-width:52px;height:52px;padding:2px 8px;border:3px solid var(--ink);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.wp b{font-family:var(--display);font-weight:400;font-size:19px}
.wp i{font-style:normal;font-size:10px;letter-spacing:1px;color:var(--orange);height:11px}
.wp[aria-current="true"]{background:var(--ink);color:#fff}
.wp[aria-current="true"] i{color:var(--yellow)}
.wp.build{border-style:dashed;padding:2px 12px}
.wp.build b{font-size:15px}
.tool-btn{flex:none;height:46px;padding:0 14px;border:3px solid var(--ink);border-radius:12px;background:var(--panel);font-weight:700}
.tool-btn[aria-expanded="true"]{background:var(--ink);color:#fff}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(330px,1fr);gap:16px;padding:16px}
.arena{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
#map{width:100%;height:100%;display:block}
.panel{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:2px}
.card{background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:12px 14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 4px}
.brief-row{display:flex;gap:10px;align-items:flex-start}
.brief-row h2{font-family:var(--display);font-weight:400;font-size:23px;margin:0 0 4px;text-wrap:balance}
.brief-row p{margin:0;max-width:46ch}
.say{flex:none;width:48px;height:48px;border:3px solid var(--ink);border-radius:50%;background:var(--panel);display:grid;place-items:center}
.say svg{width:24px;height:24px;fill:var(--ink)}
.goals{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.goal{font-size:13px;font-weight:600;border:2px solid var(--blue);color:var(--blue);border-radius:999px;padding:3px 10px;background:#fff}
.goal.darts{border-color:var(--orange);color:#fff;background:var(--orange);font-variant-numeric:tabular-nums}
.goal.darts.zero{background:#fff;color:var(--orange)}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.tools button{min-width:52px;height:52px;border:3px solid var(--ink);border-radius:10px;background:#fff;font-size:24px;padding:0 8px}
.tools button span{font-size:13px;font-weight:700}
.tools button[aria-pressed="true"]{background:var(--ink);color:#fff}
.dart-set{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;margin-left:4px}
.dart-set button{min-width:40px;height:40px;font-size:20px}
.dart-set output{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}

.palette{display:flex;flex-wrap:wrap;gap:10px}
.cmd,.chip{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:12px;font-weight:700;color:#fff;box-shadow:0 4px 0 var(--ink)}
.cmd{height:58px;padding:0 16px;font-size:18px}
.cmd:active{transform:translateY(4px);box-shadow:none}
.cmd:disabled{opacity:.4;cursor:not-allowed}
.cmd svg,.chip svg,.box-title svg{width:22px;height:22px;fill:currentColor;flex:none}
.c-F{background:var(--blue)}
.c-L,.c-R{background:var(--ink)}
.c-S{background:var(--orange)}
.c-REP{background:var(--purple)}
.c-IF{background:var(--teal)}
.cmd.new{position:relative}
.cmd.new::after{content:'NEW';position:absolute;top:-10px;right:-8px;background:var(--yellow);color:var(--ink);border:2px solid var(--ink);border-radius:6px;font-size:11px;padding:1px 5px}

.plan-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.count{font-size:13px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.plan{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px;min-height:60px;margin-top:8px}
.plan.locked{pointer-events:none}
.chip{height:46px;padding:0 12px;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.chip.now,.box.now{outline:4px solid var(--yellow);outline-offset:2px}
.chip.bad,.box.bad{outline:4px solid var(--lava);outline-offset:2px}
.slot{display:inline-flex;align-items:center;justify-content:center;height:46px;min-width:46px;padding:0 10px;border:2px dashed var(--ink-soft);border-radius:10px;background:transparent;color:var(--ink-soft);font-size:14px}
.slot.here{border-color:var(--orange);color:var(--orange);animation:pulse 1.2s ease-in-out infinite}
.box{border:3px solid var(--purple);border-radius:14px;background:rgba(122,62,224,.07);padding:6px;display:flex;flex-direction:column;gap:6px;max-width:100%}
.box.b-IF{border-color:var(--teal);background:rgba(14,159,142,.08)}
.box.target{box-shadow:0 0 0 4px rgba(255,106,19,.35)}
.box-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.box-title{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--purple)}
.b-IF>.box-head .box-title{color:var(--teal)}
.step{width:40px;height:40px;border:3px solid var(--purple);border-radius:8px;background:#fff;color:var(--purple);font-weight:700;font-size:22px;line-height:1}
.times{font-weight:700;font-size:20px;min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.lap{font-size:12px;font-weight:600;color:var(--purple)}
.verdict{font-size:12px;font-weight:700;border-radius:6px;padding:2px 6px}
.verdict.yes{background:var(--teal);color:#fff}
.verdict.no{background:#E7E9EE;color:var(--ink-soft)}
.box-x{margin-left:auto;width:36px;height:36px;border:0;background:transparent;color:var(--ink-soft);font-size:18px}
.box-body{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:46px}
.done{height:46px;padding:0 12px;border:3px solid var(--ink);border-radius:10px;background:var(--yellow);color:var(--ink);font-weight:700;font-size:14px}
.empty{color:var(--ink-soft);font-size:15px;align-self:center}

.controls{display:flex;gap:10px;flex-wrap:wrap}
.go{flex:1;min-width:160px;height:64px;border:3px solid var(--ink);border-radius:14px;background:var(--good);color:#fff;font-family:var(--display);font-size:26px;box-shadow:0 5px 0 var(--ink)}
.go:active{transform:translateY(5px);box-shadow:none}
.go.stop{background:var(--lava)}
.minor{height:64px;padding:0 16px;border:3px solid var(--ink);border-radius:14px;background:var(--panel);font-weight:700}
.minor:disabled{opacity:.4}

.result{border:3px solid var(--ink);border-radius:14px;padding:12px 14px;background:#fff;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.result[hidden]{display:none}
.result.win{background:var(--ink);color:#fff}
.result.win .stars{font-size:30px;letter-spacing:4px;color:var(--yellow)}
.result.win .stars s{text-decoration:none;color:rgba(255,255,255,.25)}
.result .big{font-family:var(--display);font-size:22px}
.result p{margin:0;flex:1;min-width:180px}
.result button{height:48px;padding:0 16px;border:3px solid currentColor;border-radius:10px;background:var(--yellow);color:var(--ink);font-weight:700}

.armory{position:absolute;right:16px;top:74px;z-index:5;width:min(340px,calc(100% - 32px));box-shadow:6px 6px 0 var(--ink)}
.armory[hidden]{display:none}
.armory h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 8px}
.row{display:grid;grid-template-columns:100px 1fr 50px;align-items:center;gap:10px;min-height:44px}
.row label{font-weight:700;font-size:15px}
.row output{font-size:13px;font-weight:600;text-align:right}
.row input[type=range]{width:100%;accent-color:var(--orange)}
.row input[type=checkbox]{width:24px;height:24px;accent-color:var(--orange)}
.swatches{display:flex;gap:8px;grid-column:2 / 4}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink)}
.swatches button[aria-pressed="true"]{outline:3px solid var(--orange);outline-offset:2px}
.hint{font-size:13px;color:var(--ink-soft);margin:8px 0 0}

#map text{user-select:none}
#player{transition:transform var(--step) ease-in-out}
#playerBody.shake{animation:shake .35s linear}
#playerBody.spin{animation:spin .9s ease-in-out}
#dart{opacity:0}
.tgt .em{transition:transform .3s ease-out, opacity .3s}
.tgt.down .em{transform:rotate(85deg) translateY(10px);opacity:.35}
.ammo.taken{opacity:.15}
.hit{fill:transparent;pointer-events:none}
.building .hit{pointer-events:all;cursor:pointer}
.building .hit:hover{fill:rgba(255,210,63,.18)}
.pop{animation:pop .35s ease-out}
.fade{animation:fade 1s ease-out forwards}
@keyframes pulse{50%{opacity:.45}}
@keyframes shake{25%{transform:translate(-7px,0)}50%{transform:translate(7px,0)}75%{transform:translate(-5px,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes fade{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.2)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.pop,.fade,#playerBody,.tgt .em{transform-box:fill-box;transform-origin:center}

@media (max-width:900px){
  body{display:block;height:auto;min-height:100%}
  .bar{flex-wrap:wrap}
  .missions{order:3;flex-basis:100%}
  main{display:flex;flex-direction:column}
  #map{height:auto}
  .panel{overflow:visible}
  .armory{top:124px}
}
@media (prefers-reduced-motion:reduce){
  .slot.here,#playerBody.shake,#playerBody.spin,.pop,.fade{animation:none}
}
</style>
</head>
<body>

<header class="bar">
  <h1>Dart <span>Ops</span></h1>
  <nav class="missions" id="missions" aria-label="Missions"></nav>
  <button class="tool-btn" id="armoryBtn" aria-expanded="false" aria-controls="armory">Armory</button>
</header>

<section class="card armory" id="armory" hidden aria-label="Armory settings">
  <h3>Armory</h3>
  <div class="row"><label id="colorLabel">Gear color</label><div class="swatches" id="swatches" role="group" aria-labelledby="colorLabel"></div></div>
  <div class="row"><label for="speed">Speed</label><input type="range" id="speed" min="1" max="3" step="1"><output id="speedOut" for="speed"></output></div>
  <div class="row"><label for="laserOpt">Laser sight</label><input type="checkbox" id="laserOpt"><span></span></div>
  <div class="row"><label for="sound">Sound</label><input type="checkbox" id="sound"><span></span></div>
  <p class="hint">The laser sight shows where your dart will fly. Turn it off for a challenge.</p>
</section>

<main>
  <div class="arena">
    <svg id="map" viewBox="-36 -36 672 578" role="img" aria-label="Foam arena with your blaster, targets, crates, lava and the flag">
      <defs>
        <pattern id="lavaPat" width="40" height="20" patternUnits="userSpaceOnUse">
          <rect width="40" height="20" fill="#E5452B"/>
          <path d="M0 14 Q10 6 20 14 T40 14" fill="none" stroke="#FF9A3D" stroke-width="4"/>
        </pattern>
      </defs>
      <rect x="-6" y="-6" width="612" height="512" rx="10" fill="#1C2430"/>
      <rect x="0" y="0" width="600" height="500" fill="#33465C"/>
      <g id="floor"></g>
      <g id="labels"></g>
      <g id="features"></g>
      <line id="laser" x1="0" y1="0" x2="0" y2="0" stroke="#FF3B2F" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10" opacity=".85"/>
      <g id="fx"></g>
      <g id="player"><g id="playerBody"></g></g>
      <g id="dart"><rect x="-4" y="-14" width="8" height="24" rx="3" fill="#FF6A13" stroke="#1C2430" stroke-width="2"/><rect x="-5" y="-20" width="10" height="9" rx="4" fill="#1C78D4" stroke="#1C2430" stroke-width="2"/></g>
      <g id="hits"></g>
      <text x="300" y="528" text-anchor="middle" font-size="12" letter-spacing="2" fill="#5A6475" font-family="Lexend, sans-serif" font-weight="600">MEEK FOAM ARENA · SAFETY GLASSES ON</text>
    </svg>
  </div>

  <div class="panel">
    <section class="card" aria-labelledby="briefTitle">
      <p class="eyebrow" id="briefEyebrow"></p>
      <div class="brief-row">
        <div style="flex:1;min-width:0">
          <h2 id="briefTitle"></h2>
          <p id="briefText"></p>
        </div>
        <button class="say" id="sayBtn" aria-label="Read the mission out loud">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z"/></svg>
        </button>
      </div>
      <div class="goals" id="goals"></div>
      <div class="tools" id="tools" hidden role="group" aria-label="Map builder tools"></div>
    </section>

    <section class="card" aria-labelledby="cmdTitle">
      <p class="eyebrow" id="cmdTitle">Commands · tap to add</p>
      <div class="palette" id="palette"></div>
    </section>

    <section class="card" aria-labelledby="planTitle">
      <div class="plan-head">
        <p class="eyebrow" id="planTitle">Battle plan · tap a block to remove it</p>
        <span class="count" id="count"></span>
      </div>
      <div class="plan" id="plan"></div>
    </section>

    <div class="controls">
      <button class="go" id="goBtn">GO!</button>
      <button class="minor" id="undoBtn">Undo</button>
      <button class="minor" id="clearBtn">Clear</button>
    </div>

    <div class="result" id="result" role="status" aria-live="polite" hidden></div>
  </div>
</main>

<script>
(function(){
'use strict';

/*LOGIC-START*/
var W = 6, H = 5;
var DIRS = [[0,-1],[1,0],[0,1],[-1,0]]; // N E S W
var CONTAINERS = {REP:1, IF:1};
var LEVELS = [
  { name:'First shot', brief:'A target is straight ahead. Tap Shoot, then press GO.',
    start:{x:0,y:2,d:1}, targets:[{x:4,y:2,t:'target'}], crates:[], lava:[], ammo:[], base:null, darts:3, pal:['F','S'], par:1 },
  { name:'Line it up', brief:'Darts only fly straight. Walk until the can is in line with you, turn to face it, then shoot.',
    start:{x:1,y:4,d:0}, targets:[{x:4,y:1,t:'can'}], crates:[], lava:[], ammo:[], base:null, darts:3, pal:['F','L','R','S'], par:5 },
  { name:'Take cover', brief:'The robot is hiding behind a crate. Darts cannot go through crates. Find another angle.',
    start:{x:0,y:1,d:1}, targets:[{x:3,y:1,t:'robot'}], crates:[{x:2,y:1}], lava:[], ammo:[], base:null, darts:3, pal:['F','L','R','S'], par:8 },
  { name:'Floor is lava', brief:'Darts fly over lava, but you cannot walk on it. Pop the balloon, then get to the flag.',
    start:{x:0,y:4,d:1}, targets:[{x:5,y:4,t:'balloon'}], crates:[], lava:[{x:1,y:4},{x:2,y:4},{x:3,y:4},{x:2,y:3},{x:3,y:3}], ammo:[], base:{x:4,y:2}, darts:2, pal:['F','L','R','S'], par:9 },
  { name:'Shooting gallery', brief:'Five targets in a row. Find the moves that repeat and put them inside one Repeat.',
    start:{x:0,y:2,d:1}, targets:[{x:0,y:1,t:'can'},{x:1,y:1,t:'target'},{x:2,y:1,t:'can'},{x:3,y:1,t:'target'},{x:4,y:1,t:'can'}], crates:[], lava:[], ammo:[], base:null, darts:5, pal:['F','L','R','S','REP'], par:5 },
  { name:'Supply drop', brief:'Your blaster is empty. Walk onto the ammo box to reload, knock down all three robots, then reach the flag.',
    start:{x:0,y:4,d:1}, targets:[{x:2,y:0,t:'robot'},{x:2,y:1,t:'robot'},{x:2,y:2,t:'robot'}], crates:[], lava:[], ammo:[{x:2,y:4,n:3}], base:{x:5,y:4}, darts:0, pal:['F','L','R','S','REP'], par:8 },
  { name:'Spin move', brief:'Targets on every side! Shoot and turn, shoot and turn. Then walk to the flag.',
    start:{x:2,y:2,d:0}, targets:[{x:2,y:0,t:'target'},{x:5,y:2,t:'can'},{x:2,y:4,t:'balloon'},{x:0,y:2,t:'robot'}], crates:[{x:0,y:0},{x:5,y:4}], lava:[], ammo:[], base:{x:2,y:0}, darts:4, pal:['F','L','R','S','REP'], par:5 },
  { name:'Peek first', brief:'Only 3 darts! New block: If target. Whatever you put inside it only happens when a target is in your sights.',
    start:{x:0,y:2,d:1}, targets:[{x:1,y:1,t:'robot'},{x:3,y:1,t:'alien'},{x:4,y:1,t:'robot'}], crates:[{x:2,y:1},{x:5,y:0}], lava:[], ammo:[], base:null, darts:3, pal:['F','L','R','S','REP','IF'], par:6 },
  { name:'Ambush alley', brief:'Targets on both sides of the hallway, and just enough darts. Peek left, peek right, every step.',
    start:{x:0,y:2,d:1}, targets:[{x:1,y:1,t:'alien'},{x:4,y:1,t:'robot'},{x:2,y:3,t:'can'},{x:3,y:3,t:'balloon'},{x:5,y:3,t:'target'}], crates:[], lava:[], ammo:[], base:{x:5,y:2}, darts:5, pal:['F','L','R','S','REP','IF'], par:10 },
  { name:'The fortress', brief:'The final mission. Grab the ammo, sweep the bottom wall, then sweep up the right wall to the flag. Two Repeats, two Ifs.',
    start:{x:0,y:4,d:1}, targets:[{x:1,y:1,t:'robot'},{x:3,y:2,t:'alien'},{x:3,y:1,t:'can'},{x:2,y:0,t:'target'}], crates:[{x:2,y:2},{x:4,y:3}], lava:[{x:2,y:3},{x:3,y:3}], ammo:[{x:1,y:4,n:4}], base:{x:5,y:0}, darts:0, pal:['F','L','R','S','REP','IF'], par:13 }
];

function countBlocks(list){
  return list.reduce(function(n,b){ return n + 1 + (CONTAINERS[b.t] ? countBlocks(b.kids) : 0); }, 0);
}
function findAt(arr,x,y){ for(var i=0;i<arr.length;i++) if(arr[i].x===x && arr[i].y===y) return i; return -1; }
function standingAt(lv,down,x,y){ for(var i=0;i<lv.targets.length;i++){ var t=lv.targets[i]; if(t.x===x && t.y===y && !down[i]) return i; } return -1; }
// what a dart fired from (x,y) facing d would hit first; end is in cell units (cell centre = x+0.5)
function ray(lv,x,y,d,down){
  var dx = DIRS[d][0], dy = DIRS[d][1], cx = x, cy = y;
  while(true){
    var nx = cx+dx, ny = cy+dy;
    if(nx<0||ny<0||nx>=W||ny>=H) return {kind:'wall', end:{x:cx+.5+dx*.5, y:cy+.5+dy*.5}};
    if(findAt(lv.crates,nx,ny)>=0) return {kind:'crate', end:{x:nx+.5-dx*.4, y:ny+.5-dy*.4}};
    var t = standingAt(lv,down,nx,ny);
    if(t>=0) return {kind:'target', idx:t, end:{x:nx+.5-dx*.15, y:ny+.5-dy*.15}};
    cx = nx; cy = ny;
  }
}
function copy(o){ var r={}; for(var k in o) r[k]=o[k]; return r; }
function simulate(lv,prog){
  var st = {x:lv.start.x, y:lv.start.y, d:lv.start.d, darts:lv.darts||0, down:{}, taken:{}};
  var frames = [], fail = null, steps = 0, LIMIT = 400;
  function push(fr){ fr.x=st.x; fr.y=st.y; fr.d=st.d; fr.darts=st.darts; fr.down=copy(st.down); frames.push(fr); steps++; }
  function run(list, prefix, laps){
    for(var i=0;i<list.length;i++){
      if(fail || steps>=LIMIT) return;
      var b = list[i], path = prefix ? prefix+'.'+i : ''+i;
      if(b.t==='REP'){
        for(var n=1;n<=b.n;n++){ var l2 = copy(laps); l2[path]=n; run(b.kids, path, l2); if(fail || steps>=LIMIT) return; }
        continue;
      }
      if(b.t==='IF'){
        var seen = ray(lv,st.x,st.y,st.d,st.down);
        var yes = seen.kind==='target';
        push({c:'IF', path:path, laps:laps, yes:yes});
        if(yes) run(b.kids, path, laps);
        continue;
      }
      var fr = {c:b.t, path:path, laps:laps, turn:0, ev:null};
      if(b.t==='L'){ st.d=(st.d+3)%4; fr.turn=-1; }
      else if(b.t==='R'){ st.d=(st.d+1)%4; fr.turn=1; }
      else if(b.t==='F'){
        var nx = st.x+DIRS[st.d][0], ny = st.y+DIRS[st.d][1];
        if(nx<0||ny<0||nx>=W||ny>=H){ fr.ev='edge'; }
        else if(findAt(lv.crates,nx,ny)>=0){ fr.ev='crate'; }
        else if(standingAt(lv,st.down,nx,ny)>=0){ fr.ev='bump'; }
        else {
          st.x=nx; st.y=ny;
          if(findAt(lv.lava,nx,ny)>=0) fr.ev='lava';
          else { var a = findAt(lv.ammo,nx,ny); if(a>=0 && !st.taken[a]){ st.taken[a]=true; st.darts += lv.ammo[a].n; fr.ev='ammo'; fr.ammoIdx=a; fr.gain=lv.ammo[a].n; } }
        }
        if(fr.ev==='edge'||fr.ev==='crate'||fr.ev==='bump'||fr.ev==='lava') fail = {why:fr.ev, path:path};
      }
      else if(b.t==='S'){
        if(st.darts<=0){ fr.ev='empty'; fail = {why:'empty', path:path}; }
        else {
          st.darts--;
          var r = ray(lv,st.x,st.y,st.d,st.down);
          fr.end = r.end;
          if(r.kind==='target'){ st.down[r.idx]=true; fr.ev='hit'; fr.hitIdx=r.idx; } else fr.ev='miss';
        }
      }
      push(fr);
    }
  }
  run(prog, '', {});
  var result;
  if(fail) result = {ok:false, why:fail.why, path:fail.path};
  else {
    var left = 0; for(var i=0;i<lv.targets.length;i++) if(!st.down[i]) left++;
    if(left>0) result = {ok:false, why:'targets', left:left};
    else if(lv.base && !(st.x===lv.base.x && st.y===lv.base.y)) result = {ok:false, why:'base'};
    else result = {ok:true};
  }
  return {frames:frames, result:result};
}
function starsFor(lv,prog){
  if(!lv.par) return 3;
  var n = countBlocks(prog);
  return n<=lv.par ? 3 : (n<=lv.par+2 ? 2 : 1);
}

var actx = null;
function audioInit(){
  if(actx || !S.settings.sound) return;

}
function beep(freq, dur, type, when, gain, slideTo){
  if(!actx || !S.settings.sound) return;
  try{
    var t = actx.currentTime + (when||0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
    g.gain.setValueAtTime(gain || 0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function tone(kind){
  if(kind==='walk') beep(200,0.08,'square',0,0.025);
  else if(kind==='turn') beep(520,0.06,'square',0,0.03);
  else if(kind==='pew') beep(900,0.18,'square',0,0.04,180);
  else if(kind==='hit'){ beep(160,0.12,'sawtooth',0,0.07); beep(660,0.1,'triangle',0.1); beep(990,0.16,'triangle',0.18); }
  else if(kind==='thud') beep(110,0.12,'sine',0,0.1);
  else if(kind==='ammo'){ beep(520,0.08); beep(780,0.08,'triangle',0.08); beep(1040,0.12,'triangle',0.16); }
  else if(kind==='yes') beep(880,0.1,'sine',0,0.05);
  else if(kind==='no') beep(330,0.1,'sine',0,0.04);
  else if(kind==='fail') beep(140,0.3,'sawtooth',0,0.06);
  else if(kind==='win'){ [523,659,784,1047].forEach(function(f,i){ beep(f,0.2,'triangle',i*0.12); }); }
  else if(kind==='tap') beep(440,0.04,'square',0,0.02);
}
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text); u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

  plan.classList.toggle('locked', S.running);
  var n = countBlocks(S.program), lv = cur();
  $('#count').textContent = n + (n===1 ? ' block' : ' blocks') + (lv.par ? ' · par ' + lv.par : '');
  $('#undoBtn').disabled = S.running || !n;
  $('#clearBtn').disabled = S.running || !n;
  var go = $('#goBtn');
  go.textContent = S.running ? 'STOP' : 'GO!';
  go.classList.toggle('stop', S.running);
  renderPalette();
}
function clearMarks(){
  var els = document.querySelectorAll('#plan .now, #plan .bad');
  for(var i=0;i<els.length;i++) els[i].classList.remove('now','bad');
  var labs = document.querySelectorAll('#plan .lap, #plan [id^="ver-"]');
  for(var j=0;j<labs.length;j++){ labs[j].textContent = ''; labs[j].className = labs[j].className.indexOf('lap')>=0 ? 'lap' : ''; }
}
function elFor(p){ return document.querySelector('#plan [data-path="'+p+'"]') || document.querySelector('#plan [data-c="'+p+'"]'); }
function markFrame(fr, cls){
  var olds = document.querySelectorAll('#plan .now');
  for(var i=0;i<olds.length;i++) olds[i].classList.remove('now');
  var el = elFor(fr.path);
  if(el){ el.classList.add(cls || 'now'); if(el.scrollIntoView){ try{ el.scrollIntoView({block:'nearest'}); }catch(e){} } }
  if(fr.laps) Object.keys(fr.laps).forEach(function(k){
    var lp = $('#lap-'+idOf(k)), blk = getBlock(k);
    if(lp && blk) lp.textContent = 'lap ' + fr.laps[k] + ' of ' + blk.n;
  });
  if(fr.c==='IF'){
    var v = $('#ver-'+idOf(fr.path));
    if(v){ v.className = 'verdict ' + (fr.yes ? 'yes' : 'no'); v.textContent = fr.yes ? 'Yes! In sights' : 'No target'; }
  }
}
function showResult(kind, html){
  var r = $('#result');
  r.className = 'result' + (kind==='win' ? ' win' : '');
  r.innerHTML = html; r.hidden = false;
  if(r.scrollIntoView){ try{ r.scrollIntoView({block:'nearest'}); }catch(e){} }
}
function hideResult(){ $('#result').hidden = true; }
function renderArmory(){
  $('#swatches').innerHTML = PAINTS.map(function(p,i){
    return '<button data-paint="'+p+'" style="background:'+p+'" aria-pressed="'+(S.settings.paint===p)+'" aria-label="Gear color '+(i+1)+'"></button>';
  }).join('');
  $('#speed').value = S.settings.speed; $('#speedOut').textContent = SPEED_WORD[S.settings.speed];
  $('#laserOpt').checked = !!S.settings.laser; $('#sound').checked = !!S.settings.sound;
  document.documentElement.style.setProperty('--step', SPEED_MS[S.settings.speed] + 'ms');
}
function renderAll(){
  renderMissions(); renderBrief(); renderProgram(); renderArmory(); drawPlayerBody(); resetFlight();
}

/* ---------- editing the plan ---------- */
function getBlock(p){
  var parts = String(p).split('.').map(Number), list = S.program, b = null;
  for(var k=0;k<parts.length;k++){ b = list[parts[k]]; if(!b) return null; list = b.kids || []; }
  return b;
}
function parentList(p){
  var parts = String(p).split('.').map(Number);
  if(parts.length===1) return {list:S.program, i:parts[0]};
  return {list:getBlock(parts.slice(0,-1).join('.')).kids, i:parts[parts.length-1]};
}
function addCmd(t){
  if(S.running) return;
  audioInit(); tone('tap'); hideResult(); resetFlight();
  var list = S.program, prefix = '';
  if(S.target!==''){ var c = getBlock(S.target); if(c){ list = c.kids; prefix = S.target; } else S.target = ''; }
  if(CONTAINERS[t]){
    if(depthOf(S.target) >= 2) return;
    list.push(t==='REP' ? {t:'REP', n:3, kids:[]} : {t:'IF', kids:[]});
    S.target = prefix==='' ? ''+(list.length-1) : prefix+'.'+(list.length-1);
  } else list.push({t:t});
  renderProgram();
}
function removeAt(p){
  var pl = parentList(p);
  pl.list.splice(pl.i,1);
  S.target = '';
  hideResult(); resetFlight(); renderProgram();
}
function lastPath(list, prefix){
  if(!list.length) return null;
  var i = list.length-1, b = list[i], p = prefix==='' ? ''+i : prefix+'.'+i;
  if(CONTAINERS[b.t] && b.kids.length) return lastPath(b.kids, p);
  return p;
}
function undo(){
  if(S.running || !S.program.length) return;
  if(S.target!==''){
    var c = getBlock(S.target), keep = S.target;
    if(c && c.kids.length){ var lp = lastPath(c.kids, S.target); var pl = parentList(lp); pl.list.splice(pl.i,1); S.target = keep; }
    else removeAt(S.target);
  } else {
    var p = lastPath(S.program, ''); var q = parentList(p); q.list.splice(q.i,1);
  }
  hideResult(); resetFlight(); renderProgram();
}
function gotoLevel(i){
  runId++; S.running = false;
  S.level = i; S.program = []; S.target = '';
  hideResult(); save(); renderAll();
}

/* ---------- running ---------- */
function failText(res){
  if(res.why==='edge') return '<p><b>Bonk! That\'s the wall.</b> The red block walked off the arena. Turn before the edge.</p>';
  if(res.why==='crate') return '<p><b>Bonk! A crate is in the way.</b> Look at the red block and walk around the crate.</p>';
  if(res.why==='bump') return '<p><b>You walked into a target.</b> Knock it down first, or walk around it.</p>';
  if(res.why==='lava') return '<p><b>The floor is lava!</b> The red block stepped in it. Find a path around.</p>';
  if(res.why==='empty') return '<p><b>Click. Out of darts!</b> Grab an ammo box, or only shoot when a target is in your sights.</p>';
  if(res.why==='targets') return '<p><b>Still standing: ' + res.left + '.</b> Line up with each one, face it, and Shoot. Darts only fly straight.</p>';
  return '<p><b>All targets down!</b> Now finish the plan on the flag.</p>';
}
function go(){
  var lv = cur();
  if(S.running){ runId++; S.running = false; resetFlight(); renderProgram(); return; }
  hideResult();
  if(!countBlocks(S.program)){ showResult('warn','<p><b>Your battle plan is empty.</b> Tap a command to add it.</p>'); return; }
  if(isBuild() && !lv.targets.length && !lv.base){ showResult('warn','<p><b>No goal yet.</b> Add a target or a flag to the arena first.</p>'); return; }
  audioInit();
  S.target = ''; S.running = true;
  var my = ++runId;
  resetFlight(); renderProgram();
  var sim = simulate(lv, S.program);
  var angle = lv.start.d*90, ms = SPEED_MS[S.settings.speed];
  var i = 0;
  function next(){
    if(my!==runId) return;
    if(i>=sim.frames.length){ finish(sim.result, my); return; }
    var fr = sim.frames[i++];
    markFrame(fr);
    var body = $('#playerBody'), wait = ms;
    if(fr.turn){ angle += fr.turn*90; placePlayer(fr.x, fr.y, angle); tone('turn'); hideLaser(); }
    else if(fr.c==='F'){
      if(fr.ev==='edge'||fr.ev==='crate'||fr.ev==='bump'){ body.classList.remove('shake'); void body.getBoundingClientRect(); body.classList.add('shake'); tone('fail'); }
      else { placePlayer(fr.x, fr.y, angle); tone('walk'); hideLaser(); }
    }
    else if(fr.c==='IF'){ tone(fr.yes ? 'yes' : 'no'); }
    else if(fr.c==='S'){
      if(fr.ev==='empty'){ tone('fail'); body.classList.remove('shake'); void body.getBoundingClientRect(); body.classList.add('shake'); }
      else { shoot(fr, angle, ms); setDarts(fr.darts); }
    }
    sleep(wait).then(function(){
      if(my!==runId) return;
      drawLaser(fr.x, fr.y, fr.d, fr.down);
      if(fr.ev==='ammo'){
        var am = $('#am'+fr.ammoIdx); if(am) am.classList.add('taken');
        var c = center(fr.x, fr.y);
        addFx('<text class="fade" x="'+c[0]+'" y="'+(c[1]-40)+'" text-anchor="middle" font-family="Bungee, sans-serif" font-size="26" fill="#FFD23F" stroke="#1C2430" stroke-width="1.5">+'+fr.gain+' darts</text>');
        tone('ammo'); setDarts(fr.darts);
      }
      if(fr.ev==='lava'){ body.classList.remove('shake'); void body.getBoundingClientRect(); body.classList.add('shake'); tone('fail'); sleep(380).then(next); }
      else next();
    });
  }
  sleep(200).then(next);
}
function shoot(fr, angle, ms){
  var d = $('#dart'), c = center(fr.x, fr.y), dx = DIRS[fr.d][0], dy = DIRS[fr.d][1];
  var sx = c[0]+dx*55, sy = c[1]+dy*55, ex = fr.end.x*100, ey = fr.end.y*100;
  var dist = Math.abs(ex-sx)+Math.abs(ey-sy), t = Math.max(120, Math.min(ms*0.7, dist*1.1));
  tone('pew');
  d.style.transition = 'none';
  d.style.transform = 'translate('+sx+'px,'+sy+'px) rotate('+angle+'deg)';
  d.style.opacity = '1';
  d.getBoundingClientRect();
  d.style.transition = 'transform '+t+'ms linear';
  d.style.transform = 'translate('+ex+'px,'+ey+'px) rotate('+angle+'deg)';
  setTimeout(function(){
    d.style.opacity = '0';
    if(fr.ev==='hit'){ knock(fr.hitIdx); tone('hit'); }
    else { stuckDart(fr.end, angle); tone('thud'); }
  }, t);
}
function finish(res, my){
  if(my!==runId) return;
  S.running = false;
  renderProgram();
  if(res.ok){
    var lv = cur(), n = countBlocks(S.program), st = starsFor(lv, S.program);
    tone('win');
    var body = $('#playerBody'); body.classList.remove('spin'); void body.getBoundingClientRect(); body.classList.add('spin');
    var h = '<div><div class="big">Mission complete</div>';
    if(!isBuild()){
      if(!S.progress[S.level] || S.progress[S.level]<st) S.progress[S.level] = st;
      save(); renderMissions();
      h += '<div class="stars" aria-label="'+st+' of 3 stars">' + '★★★'.slice(0,st) + '<s>' + '★★★'.slice(0,3-st) + '</s></div></div>';
      h += '<p>You used ' + n + (n===1?' block':' blocks') + '.' + (st<3 ? ' Can you do it in ' + lv.par + '? Look for moves that repeat.' : ' Three stars. Sharpshooter!') + '</p>';
      h += (S.level < LEVELS.length-1) ? '<button data-next="'+(S.level+1)+'">Next mission</button>' : '<button data-next="'+BUILD+'">Build your own</button>';
    } else {
      h += '</div><p>Your mission works in ' + n + (n===1?' block':' blocks') + '. Hand it to a teammate and see if they can beat that.</p><button data-clearplan="1">Clear the plan</button>';
    }
    showResult('win', h);
  } else {
    tone('fail');
    if(res.path!=null){ var el = elFor(res.path); if(el){ el.classList.remove('now'); el.classList.add('bad'); } }
    showResult('fail', failText(res));
  }
}

/* ---------- builder ---------- */
function buildTap(x,y){
  if(!isBuild() || S.running) return;
  var c = S.custom, onStart = (c.start.x===x && c.start.y===y), t = S.tool;
  function notHere(a){ return !(a.x===x && a.y===y); }
  function wipe(){
    c.targets = c.targets.filter(notHere); c.crates = c.crates.filter(notHere);
    c.lava = c.lava.filter(notHere); c.ammo = c.ammo.filter(notHere);
    if(c.base && c.base.x===x && c.base.y===y) c.base = null;
  }
  hideResult();
  if(t==='player'){
    if(onStart) c.start.d = (c.start.d+1)%4;
    else { wipe(); c.start = {x:x, y:y, d:c.start.d}; }
  }
  else if(t==='erase'){ wipe(); }
  else if(onStart){ showResult('warn','<p><b>You are standing there.</b> Pick "You" and move first.</p>'); return; }
  else if(t==='base'){ wipe(); c.base = {x:x, y:y}; }
  else if(t==='crate'){ wipe(); c.crates.push({x:x, y:y}); }
  else if(t==='lava'){ wipe(); c.lava.push({x:x, y:y}); }
  else if(t==='ammo'){ wipe(); c.ammo.push({x:x, y:y, n:3}); }
  else { wipe(); c.targets.push({x:x, y:y, t:t}); }
  audioInit(); tone('tap');
  save(); renderBrief(); resetFlight();
}

/* ---------- events ---------- */
function wire(){
  $('#missions').addEventListener('click', function(e){
    var b = e.target.closest('[data-level]'); if(b) gotoLevel(Number(b.getAttribute('data-level')));
  });
  $('#palette').addEventListener('click', function(e){
    var b = e.target.closest('[data-cmd]'); if(b && !b.disabled) addCmd(b.getAttribute('data-cmd'));
  });
  $('#plan').addEventListener('click', function(e){
    if(S.running) return;
    var el;
    if((el = e.target.closest('[data-step]'))){
      var blk = getBlock(el.getAttribute('data-p'));
      blk.n = Math.max(2, Math.min(9, blk.n + Number(el.getAttribute('data-step'))));
      hideResult(); resetFlight(); renderProgram(); return;
    }
    if((el = e.target.closest('[data-del]'))){ removeAt(el.getAttribute('data-del')); return; }
    if((el = e.target.closest('[data-done]'))){
      var parts = S.target.split('.'); parts.pop(); S.target = parts.join('.'); renderProgram(); return;
    }
    if((el = e.target.closest('[data-path]'))){ removeAt(el.getAttribute('data-path')); return; }
    if((el = e.target.closest('[data-open]'))){ S.target = el.getAttribute('data-open'); renderProgram(); return; }
    if((el = e.target.closest('[data-body]'))){ S.target = el.getAttribute('data-body'); renderProgram(); return; }
  });
  $('#goBtn').addEventListener('click', go);
  $('#undoBtn').addEventListener('click', undo);
  $('#clearBtn').addEventListener('click', function(){ if(S.running) return; S.program = []; S.target = ''; hideResult(); resetFlight(); renderProgram(); });
  $('#result').addEventListener('click', function(e){
    var b = e.target.closest('[data-next]');
    if(b){ gotoLevel(Number(b.getAttribute('data-next'))); return; }
    if(e.target.closest('[data-clearplan]')){ S.program = []; S.target = ''; hideResult(); resetFlight(); renderProgram(); }
  });
  $('#sayBtn').addEventListener('click', function(){ speak(cur().name + '. ' + cur().brief); });
  if(!('speechSynthesis' in window)) $('#sayBtn').hidden = true;
  $('#tools').addEventListener('click', function(e){
    var dd = e.target.closest('[data-darts]');
    if(dd){ S.custom.darts = Math.max(0, Math.min(20, S.custom.darts + Number(dd.getAttribute('data-darts')))); save(); renderBrief(); resetFlight(); return; }
    var b = e.target.closest('[data-tool]'); if(!b) return;
    S.tool = b.getAttribute('data-tool'); renderBrief();
  });
  $('#hits').addEventListener('click', function(e){
    var r = e.target.closest('.hit'); if(r) buildTap(Number(r.getAttribute('data-x')), Number(r.getAttribute('data-y')));
  });
  $('#armoryBtn').addEventListener('click', function(){
    var a = $('#armory'); a.hidden = !a.hidden;
    this.setAttribute('aria-expanded', String(!a.hidden));
  });
  $('#swatches').addEventListener('click', function(e){
    var b = e.target.closest('[data-paint]'); if(!b) return;
    S.settings.paint = b.getAttribute('data-paint'); save(); renderArmory(); drawPlayerBody();
  });
  $('#speed').addEventListener('input', function(){ S.settings.speed = Number(this.value); save(); renderArmory(); });
  $('#laserOpt').addEventListener('change', function(){ S.settings.laser = this.checked; save(); if(!S.running) resetFlight(); });
  $('#sound').addEventListener('change', function(){ S.settings.sound = this.checked; save(); if(this.checked){ audioInit(); tone('ammo'); } });
}

function start(seed){
  load(seed);
  drawStatic(); wire(); renderAll();
  try{
    if(window.claude && window.claude.hot && window.claude.hot.snapshot){
      window.claude.hot.snapshot(function(){
        return {level:S.level, program:S.program, progress:S.progress, settings:S.settings, custom:S.custom};
      });
    }
  }catch(e){}
}
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
